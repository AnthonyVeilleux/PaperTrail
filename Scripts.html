<!-- Script tag originally in index.html, now in its own file for organizational purposes -->
<script>
  let currentFilter = 'projects';
  let allTags = null;
  let currentTag = null;
  let expandedProjects = [];
  let expandedTags = {};
  let expandedOccurrences = {};
  let occurrenceDetails = {};
  let refreshTimer=null;
  let isRefreshing=false;
  let lastSeenUpdated='';
  let autocompleteInitialized=false;
  let globalSearchTerm = '';
  let globalSearchResults = null;
  let globalSearchLoading = false;
  let globalSubmittedQuery = '';
  let globalAutocompleteCatalog = [];
  let globalAutocompleteLoaded = false;
  let globalAutocompleteLoading = false;

  const colors = [
    { value: '#1A73E8', name: 'Blue' },
    { value: '#34A853', name: 'Green' },
    { value: '#FBBC04', name: 'Yellow' },
    { value: '#EA4335', name: 'Red' },
    { value: '#9334E9', name: 'Purple' },
    { value: '#0891B2', name: 'Cyan' }
  ];

  // Load tags on startup
  window.onload = function() {
    console.log('Loading tags...');
    loadTags();
    setupKeyboardShortcuts();
    startAutoRefresh();
  };

  // Setup keyboard shortcuts
  function setupKeyboardShortcuts() {
    console.log('Setting up keyboard shortcuts...');
    
    // Handle Shift+K to toggle sidebar
    function handleKeyDown(e) {
      console.log('Key event captured:', {key: e.key, code: e.code, shift: e.shiftKey, ctrl: e.ctrlKey});
      
      // Check for Shift+K
      if (e.shiftKey && (e.code === 'KeyK' || e.key === 'K' || e.key === 'k')) {
        e.preventDefault();
        e.stopPropagation();
        console.log('✓ Shift+K detected - Closing sidebar');
        
        // Show visual feedback
        const header = document.querySelector('.header');
        if (header) {
          header.style.backgroundColor = '#e8f0fe';
          header.style.transition = 'background-color 0.3s ease';
        }
        
        // Call the Google Apps Script function to close the sidebar
        setTimeout(function() {
          google.script.run
            .withSuccessHandler(function() {
              console.log('Sidebar closed successfully');
            })
            .withFailureHandler(function(error) {
              console.error('Error closing sidebar:', error);
            })
            .hideSidebar();
        }, 100);
      }
    }
    
    // Attach listeners with capture phase for better event catching
    document.addEventListener('keydown', handleKeyDown, true);
    window.addEventListener('keydown', handleKeyDown, true);
    document.body && document.body.addEventListener('keydown', handleKeyDown, true);
    
    // Also add keyup as backup
    document.addEventListener('keyup', function(e) {
      if (e.shiftKey && (e.code === 'KeyK' || e.key === 'K' || e.key === 'k')) {
        console.log('Shift+K key up event');
      }
    }, true);
    
    console.log('✓ Keyboard shortcuts setup complete');
  }

  // ===== AUTOCOMPLETE FEATURE =====
  let autocompleteData = [];
  let currentAutocompleteIndex = -1;
  
  function initializeAutocomplete() {
    const searchInput = document.getElementById('searchInput');
    const autocompleteList = document.getElementById('autocompleteList');
    
    // Input event for showing suggestions
    searchInput.addEventListener('input', function(e) {
      if (currentFilter === 'global') {
        const query = getGlobalActiveTokenQuery_(e.target.value);
        if (!query) {
          autocompleteList.classList.remove('show');
          currentAutocompleteIndex = -1;
          return;
        }

        if (!globalAutocompleteLoaded) {
          ensureGlobalAutocompleteCatalog_();
          autocompleteList.classList.remove('show');
          currentAutocompleteIndex = -1;
          return;
        }

        const matches = globalAutocompleteCatalog
          .filter(function(tag) {
            return String(tag.name || '').toLowerCase().includes(query);
          })
          .slice(0, 10);

        if (!matches.length) {
          autocompleteData = [];
          currentAutocompleteIndex = -1;
          autocompleteList.classList.remove('show');
          return;
        }

        autocompleteData = matches;
        currentAutocompleteIndex = -1;
        renderAutocompleteList(matches, query);
        autocompleteList.classList.add('show');
        return;
      }

      const query = e.target.value.trim().toLowerCase();
      
      if (query.length === 0) {
        autocompleteList.classList.remove('show');
        currentAutocompleteIndex = -1;
        if (allTags && allTags.projects) {
          renderProjectsView(allTags.projects);
        }
        return;
      }
      
      // Get all available tags from allTags
      const allTagsList = getAllTagsFromData();
      
      // Filter tags based on query
      const matches = allTagsList.filter(tag => 
        tag.name.toLowerCase().includes(query)
      ).slice(0, 10); // Limit to 10 results
      
      if (matches.length === 0) {
        autocompleteList.classList.remove('show');
        return;
      }
      
      autocompleteData = matches;
      currentAutocompleteIndex = -1;
      renderAutocompleteList(matches, query);
      autocompleteList.classList.add('show');
    });
    
    // Keyboard navigation
    searchInput.addEventListener('keydown', function(e) {
      const autocompleteList = document.getElementById('autocompleteList');

      if (currentFilter === 'global' && e.key === 'Enter' && !autocompleteList.classList.contains('show')) {
        e.preventDefault();
        performSearch();
        return;
      }

      if (currentFilter === 'projects' && e.key === 'Enter' && !autocompleteList.classList.contains('show')) {
        e.preventDefault();
        performSearch();
        return;
      }

      if (!autocompleteList.classList.contains('show')) return;
      
      switch(e.key) {
        case 'ArrowDown':
          e.preventDefault();
          currentAutocompleteIndex = Math.min(currentAutocompleteIndex + 1, autocompleteData.length - 1);
          updateAutocompleteSelection();
          break;
        case 'ArrowUp':
          e.preventDefault();
          currentAutocompleteIndex = Math.max(currentAutocompleteIndex - 1, -1);
          updateAutocompleteSelection();
          break;
        case 'Enter':
          e.preventDefault();
          if (currentAutocompleteIndex >= 0 && autocompleteData[currentAutocompleteIndex]) {
            selectAutocompleteItem(autocompleteData[currentAutocompleteIndex]);
          } else {
            autocompleteList.classList.remove('show');
            currentAutocompleteIndex = -1;
            if (currentFilter === 'global') {
              performSearch();
            }
          }
          break;
        case ' ':
          if (currentAutocompleteIndex >= 0 && autocompleteData[currentAutocompleteIndex]) {
            e.preventDefault();
            selectAutocompleteItem(autocompleteData[currentAutocompleteIndex], { appendSpace: true, runSearch: false });
          }
          break;
        case 'Escape':
          autocompleteList.classList.remove('show');
          currentAutocompleteIndex = -1;
          break;
      }
    });
    
    // Close autocomplete when clicking outside
    document.addEventListener('click', function(e) {
      if (e.target !== searchInput) {
        autocompleteList.classList.remove('show');
      }
    });
  }
  
  function getAllTagsFromData() {
    const tags = [];
    if (!allTags) return tags;
    
    // Get tags from projects
    if (allTags.projects) {
      allTags.projects.forEach(project => {
        if (project.tags) {
          project.tags.forEach(tag => {
            if (!tags.find(t => t.name === tag.name)) {
              tags.push({
                name: tag.name,
                count: tag.count,
                color: tag.color,
                type: 'project'
              });
            }
          });
        }
      });
    }
    
    // Get global tags
    if (allTags.globalTags) {
      allTags.globalTags.forEach(tag => {
        if (!tags.find(t => t.name === tag.name)) {
          tags.push({
            name: tag.name,
            count: tag.count,
            color: tag.color,
            type: 'global'
          });
        }
      });
    }
    
    return tags.sort((a, b) => b.count - a.count); // Sort by count
  }
  
  function renderAutocompleteList(matches, query) {
    const autocompleteList = document.getElementById('autocompleteList');
    const html = matches.map((tag, index) => {
      const highlightedName = highlightQuery(tag.name, query);
      return `
        <div class="autocomplete-item" data-index="${index}" onmouseenter="setAutocompleteIndex(${index})" onclick="selectAutocompleteItem({name: '${tag.name}', count: ${tag.count}, color: '${tag.color}', type: '${tag.type}'})">
          <div class="autocomplete-icon">#</div>
          <div class="autocomplete-text">${highlightedName}</div>
          <div class="autocomplete-count">${tag.count}</div>
        </div>
      `;
    }).join('');
    
    autocompleteList.innerHTML = html;
  }
  
  function highlightQuery(text, query) {
    const regex = new RegExp(`(${query})`, 'gi');
    return text.replace(regex, '<span class="autocomplete-match">$1</span>');
  }
  
  function updateAutocompleteSelection() {
    const items = document.querySelectorAll('.autocomplete-item');
    items.forEach((item, index) => {
      if (index === currentAutocompleteIndex) {
        item.classList.add('selected');
        item.scrollIntoView({ block: 'nearest' });
      } else {
        item.classList.remove('selected');
      }
    });
  }

  function setAutocompleteIndex(index) {
    currentAutocompleteIndex = index;
    updateAutocompleteSelection();
  }
  
  function selectAutocompleteItem(tag, options) {
    const opts = options || {};
    const appendSpace = !!opts.appendSpace;
    const runSearch = opts.runSearch !== false;
    const searchInput = document.getElementById('searchInput');
    const autocompleteList = document.getElementById('autocompleteList');

    if (currentFilter === 'global') {
      searchInput.value = applyGlobalSuggestion_(searchInput.value, tag.name);
      if (appendSpace) {
        searchInput.value = searchInput.value + ' ';
      }
    } else {
      searchInput.value = '#' + tag.name + (appendSpace ? ' ' : '');
    }

    autocompleteList.classList.remove('show');
    currentAutocompleteIndex = -1;
    
    // Perform search/filter
    if (runSearch) {
      if (currentFilter === 'global') {
        performSearch();
      } else {
        performSearch(tag.name);
      }
    }
  }
  
  function performSearch(tagName) {
    if (!allTags) return;

    if (currentFilter === 'global') {
      const searchInput = document.getElementById('searchInput');
      const baseQuery = typeof tagName === 'string' && tagName.trim() ? tagName : searchInput.value;
      const normalized = normalizeTagQuery_(baseQuery);

      searchInput.value = normalized ? '#' + normalized : '';
      globalSubmittedQuery = normalized;
      globalSearchTerm = '';
      globalSearchResults = null;
      renderGlobalView();
      return;
    }
    
    const searchInput = document.getElementById('searchInput');
    const query = searchInput.value.replace(/#/g, '').trim().toLowerCase();

    if (!query) {
      renderProjectsView(allTags.projects || []);
      return;
    }
    
    // Filter projects and tags
    const filteredProjects = allTags.projects.map(project => ({
      ...project,
      tags: project.tags ? project.tags.filter(tag => 
        tag.name.toLowerCase().includes(query)
      ) : []
    })).filter(project => project.tags.length > 0);
    
    if (filteredProjects.length === 0) {
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="empty-state">
          <div style="font-size:48px;margin-bottom:12px;">🔍</div>
          <div class="empty-title">No Tags Found</div>
          <p style="font-size:12px;color:#80868b;margin-top:8px;">No tags matching "<strong>#${query}</strong>"</p>
        </div>
      `;
    } else {
      renderProjectsView(filteredProjects);
    }
  }

  function isLocalSearchActive_() {
    if (currentFilter !== 'projects') {
      return false;
    }
    var searchInput = document.getElementById('searchInput');
    if (!searchInput) {
      return false;
    }
    return String(searchInput.value || '').replace(/#/g, '').trim().length > 0;
  }

  function refreshCurrentView_() {
    if (!allTags) {
      return;
    }

    if (currentFilter === 'projects' && isLocalSearchActive_()) {
      performSearch();
      return;
    }

    if (currentFilter === 'global') {
      renderGlobalView();
      return;
    }

    renderProjectsView(allTags.projects || []);
  }
  // ===== END AUTOCOMPLETE FEATURE =====

  function loadTags() {
    if (isRefreshing) return;
    isRefreshing=true;
    console.log('Calling getAllTags...');
    google.script.run
      .withSuccessHandler(function(data) {
        console.log('Success! Received data:', data);
        if (data && data.lastUpdated && data.lastUpdated !== lastSeenUpdated) {
          lastSeenUpdated = data.lastUpdated;
        }
        renderTags(data);
        refreshExpandedOccurrences();
        isRefreshing=false;
      })
      .withFailureHandler(function(error) {
        console.error('Error:', error);
        showError(error);
        isRefreshing=false;
      })
      .getAllTags();
  }
  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);

    refreshTimer = setInterval(function () {
      if (isRefreshing) return;
      loadTags();
    }, 2000);
  }


  function renderTags(data) {
    console.log('Rendering tags:', data);
    allTags = data;
    const content = document.getElementById('content');
    
    // Initialize autocomplete with loaded data
    if (!autocompleteInitialized){
      initializeAutocomplete();
      autocompleteInitialized=true;
    }
    
    
    if (currentFilter === 'projects') {
      if (isLocalSearchActive_()) {
        performSearch();
      } else {
        renderProjectsView(data.projects);
      }
    } else if (currentFilter === 'global') {
      renderGlobalView();
    } else {
      content.innerHTML = '<div class="empty-state"><div class="empty-title">Coming Soon</div></div>';
    }
  }

  function renderDateView(projects) {
    const content = document.getElementById('content');
    
    // Collect all tags with their project info
    const tagsByDate = {};
    const today = new Date().toISOString().split('T')[0];
    const defaultDate = today;
    
    projects.forEach(project => {
      if (project.tags) {
        project.tags.forEach(tag => {
          // Group by creation/usage date (using current date as placeholder)
          // In a real implementation, this would come from tag metadata
          const dateKey = defaultDate;
          
          if (!tagsByDate[dateKey]) {
            tagsByDate[dateKey] = [];
          }
          
          tagsByDate[dateKey].push({
            ...tag,
            projectName: project.name,
            projectId: project.id
          });
        });
      }
    });
    
    if (Object.keys(tagsByDate).length === 0) {
      content.innerHTML = `
        <div class="empty-state">
          <div style="font-size:48px;margin-bottom:12px;">📅</div>
          <div class="empty-title">No Tags by Date</div>
          <p style="font-size:12px;color:#80868b;margin-top:8px;">Tags will be organized by date here</p>
        </div>
      `;
      return;
    }
    
    let html = '';
    
    // Sort dates in descending order
    Object.keys(tagsByDate).sort().reverse().forEach(dateKey => {
      const tags = tagsByDate[dateKey];
      const totalCount = tags.reduce((sum, tag) => sum + tag.count, 0);
      
      // Format date nicely
      const date = new Date(dateKey + 'T00:00:00');
      const today = new Date().toISOString().split('T')[0];
      let dateLabel = dateKey;
      
      if (dateKey === today) {
        dateLabel = 'Today';
      } else {
        dateLabel = date.toLocaleDateString('en-US', { 
          weekday: 'short', 
          month: 'short', 
          day: 'numeric',
          year: 'numeric'
        });
      }
      
      html += `
        <div class="project">
          <div class="project-header" onclick="toggleDateGroup('${dateKey}')">
            <span style="font-size:16px;">📅</span>
            <div class="project-name">${dateLabel} <span class="tag-count">${totalCount}</span></div>
          </div>
      `;
      
      const isExpanded = expandedProjects.includes(dateKey);
      if (isExpanded) {
        html += '<div class="tags-list">';
        tags.forEach(tag => {
          const tagColor = tag.color || '#80868b';
          html += `
            <div class="tag-item" onclick="handleTagClick('${tag.name}', event, ${tag.count})">
              <div class="tag-main">
                <div class="tag-dot" style="background-color:${tagColor}; flex-shrink: 0;"></div>
                <span class="tag-name">#${tag.name}</span>
                ${tag.count > 0 ? `<span class="tag-count-badge">${tag.count}</span>` : ''}
                <span style="font-size:11px;color:#5f6368;">in this document</span>
              </div>
            </div>
            ${tag.count > 1 && expandedOccurrences[tag.name] ? renderOccurrencesList(tag.name, tag.count, tagColor) : ''}
          `;
        });
        html += '</div>';
      }
      
      html += '</div>';
    });
    
    content.innerHTML = html;
  }

  function renderGlobalView() {
    const content = document.getElementById('content');

    if (!globalAutocompleteLoaded) {
      ensureGlobalAutocompleteCatalog_();
    }

    const queryTags = parseTagQuery_(globalSubmittedQuery);
    const queryKey = queryTags.join('|');

    if (!queryTags.length) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="global-empty-icon">🌍</div>
          <div class="empty-title">Search Global Index</div>
          <p class="global-empty-copy">Type one or more tags like <strong>#project-1 #methods</strong> and press Enter to search</p>
        </div>
      `;
      return;
    }

    if (globalSearchLoading && globalSearchTerm === queryKey) {
      content.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>Searching index for ${formatTagList_(queryTags)}...</div>
        </div>
      `;
      return;
    }

    if (globalSearchTerm === queryKey && Array.isArray(globalSearchResults)) {
      renderGlobalSearchResults_(queryTags, globalSearchResults);
      return;
    }

    globalSearchLoading = true;
    globalSearchTerm = queryKey;
    content.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        <div>Searching index for ${formatTagList_(queryTags)}...</div>
      </div>
    `;

    google.script.run
      .withSuccessHandler(function(rows) {
        globalSearchLoading = false;
        globalSearchResults = Array.isArray(rows) ? rows : [];
        if (currentFilter === 'global') {
          renderGlobalSearchResults_(queryTags, globalSearchResults);
        }
      })
      .withFailureHandler(function(error) {
        globalSearchLoading = false;
        globalSearchResults = [];
        content.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">Global Search Failed</div>
            <p style="font-size:12px;color:#80868b;margin-top:8px;">${(error && error.message) ? error.message : error}</p>
          </div>
        `;
      })
      .searchIndexedDocsByTags(queryTags, 'AND');
  }

  function renderGlobalSearchResults_(queryTags, rows) {
    const content = document.getElementById('content');
    const queryLabel = formatTagList_(queryTags);
    const queryChips = queryTags.map(function(tag) {
      return '<span class="global-query-chip">#' + escapeHtml_(tag) + '</span>';
    }).join('');

    if (!rows.length) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="global-empty-icon">🔍</div>
          <div class="empty-title">No Indexed Matches</div>
          <p class="global-empty-copy">No documents found for <strong>${queryLabel}</strong></p>
        </div>
      `;
      return;
    }

    const sortedRows = rows.slice().sort(function(a, b) {
      const countDiff = Number(b.tagCountInDoc || 0) - Number(a.tagCountInDoc || 0);
      if (countDiff !== 0) {
        return countDiff;
      }
      return String(a.docTitle || '').localeCompare(String(b.docTitle || ''));
    });

    let html = `
      <div class="global-results-wrap">
        <div class="global-results-header">
          <div class="global-query-chip-list">${queryChips}</div>
          <span class="global-result-count">${sortedRows.length} documents</span>
        </div>
        <div class="global-results-list">
    `;
    sortedRows.forEach(function(row) {
      const matchedTags = Array.isArray(row.tags) && row.tags.length
        ? row.tags
        : Object.keys(row.matchedTags || {});
      const matchedTagChips = matchedTags.length
        ? matchedTags.map(function(tag) {
            return '<span class="global-match-chip">#' + escapeHtml_(tag) + '</span>';
          }).join('')
        : '<span class="global-match-chip global-match-chip-empty">(none)</span>';

      html += `
        <div class="global-result-card" onclick="event.stopPropagation()">
          <div class="global-result-main">
            <div class="global-result-content">
              <div class="global-result-top">
                <div class="global-result-title" title="${escapeHtml_(row.docTitle || '(Untitled document)')}">${escapeHtml_(row.docTitle || '(Untitled document)')}</div>
                <span class="tag-count-badge global-count-badge">${Number(row.tagCountInDoc || 0)} hits</span>
              </div>
              <div class="global-result-tags">${matchedTagChips}</div>
              <div class="global-result-footer">
                <span class="global-result-meta">Last indexed: ${escapeHtml_(row.lastSeenAt || '')}</span>
                <a class="global-result-link" href="${escapeHtml_(row.docUrl || '#')}" target="_blank" rel="noopener noreferrer">Open</a>
              </div>
            </div>
          </div>
        </div>
      `;
    });
    html += '</div></div>';
    content.innerHTML = html;
  }

  function normalizeTagQuery_(raw) {
    return String(raw || '').replace(/^#/, '').trim().toLowerCase();
  }

  function getGlobalActiveTokenQuery_(raw) {
    const input = String(raw || '');
    const parts = input.split(/([\s,]+)/);
    const lastToken = parts.length ? parts[parts.length - 1] : input;
    return normalizeTagQuery_(lastToken);
  }

  function applyGlobalSuggestion_(rawInput, suggestedTag) {
    const input = String(rawInput || '');
    const parts = input.split(/([\s,]+)/);
    const replacement = '#' + String(suggestedTag || '').trim();

    if (!parts.length) {
      return replacement;
    }

    // If last segment is a separator, append a new tag token.
    if (/^[\s,]+$/.test(parts[parts.length - 1])) {
      parts.push(replacement);
      return parts.join('');
    }

    // Replace the active trailing token only.
    parts[parts.length - 1] = replacement;
    return parts.join('');
  }

  function parseTagQuery_(raw) {
    const parts = String(raw || '')
      .split(/[\s,]+/)
      .map(part => normalizeTagQuery_(part))
      .filter(Boolean);
    return Array.from(new Set(parts));
  }

  function formatTagList_(tags) {
    return tags.map(tag => '#' + tag).join(' ');
  }

  function formatMatchedTags_(tags) {
    if (!Array.isArray(tags) || !tags.length) {
      return '(none)';
    }
    return tags.map(tag => '#' + tag).join(', ');
  }

  function ensureGlobalAutocompleteCatalog_() {
    if (globalAutocompleteLoaded || globalAutocompleteLoading) {
      return;
    }

    globalAutocompleteLoading = true;
    google.script.run
      .withSuccessHandler(function(matches) {
        globalAutocompleteCatalog = Array.isArray(matches) ? matches : [];
        globalAutocompleteLoaded = true;
        globalAutocompleteLoading = false;
      })
      .withFailureHandler(function(error) {
        console.error('Error loading global autocomplete catalog:', error);
        globalAutocompleteCatalog = [];
        globalAutocompleteLoaded = false;
        globalAutocompleteLoading = false;
      })
      .getIndexedTagSuggestions('', 10000);
  }

  function escapeHtml_(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function toggleDateGroup(dateKey) {
    const index = expandedProjects.indexOf(dateKey);
    if (index > -1) {
      expandedProjects.splice(index, 1);
    } else {
      expandedProjects.push(dateKey);
    }
    refreshCurrentView_();
  }

  function renderProjectsView(projects) {
    const content = document.getElementById('content');

    const combinedTagsMap = {};
    if (projects) {
      projects.forEach(project => {
        (project.tags || []).forEach(tag => {
          if (!combinedTagsMap[tag.name]) {
            combinedTagsMap[tag.name] = { ...tag };
          } else {
            combinedTagsMap[tag.name].count += tag.count;
          }
        });
      });
    }

    const combinedTags = Object.values(combinedTagsMap);

    if (!combinedTags.length) {
      content.innerHTML = `
        <div class="empty-state">
          <div style="font-size:48px;margin-bottom:12px;">🏷️</div>
          <div class="empty-title">No Tags Found</div>
          <p style="font-size:12px;color:#80868b;margin-top:8px;">Start typing #tagname in your document</p>
          <button onclick="loadTags()" style="margin-top:16px;padding:8px 16px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;">Refresh Tags</button>
        </div>
      `;
      return;
    }

    const combinedProject = {
      id: projects && projects.length ? projects[0].id : null,
      tags: combinedTags
    };

    content.innerHTML = `<div class="project">${renderProjectTags(combinedProject)}</div>`;
  }

  function buildTagTree(tags) {
    const tree = {};
    
    tags.forEach(tag => {
      const parts = tag.name.split('.');
      let current = tree;
      let fullPath = '';
      
      for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        fullPath = fullPath ? fullPath + '.' + part : part;
        const isLast = i === parts.length - 1;
        
        if (!current[part]) {
          current[part] = { 
            children: {}, 
            tag: null, 
            fullPath: fullPath,
            isIntermediate: !isLast
          };
        }
        
        if (isLast) {
          current[part].tag = tag;
          current[part].isIntermediate = false;
        }
        
        current = current[part].children;
      }
    });
    
    return tree;
  }

  function renderTagNode(node, key, depth, projectId) {
    if (!node) return '';
    
    const tag = node.tag;
    const fullPath = node.fullPath;
    const hasChildren = Object.keys(node.children).length > 0;
    const isIntermediate = node.isIntermediate && !tag; // Intermediate if no tag but has children
    const isGroupNode = isIntermediate && hasChildren;
    const hasExplicitExpandState = expandedTags && Object.prototype.hasOwnProperty.call(expandedTags, fullPath);
    const isExpanded = isGroupNode
      ? (hasExplicitExpandState ? !!expandedTags[fullPath] : true)
      : (expandedTags && !!expandedTags[fullPath]);
    
    // Group nodes and real parent tags should both be expandable.
    const shouldShowExpandButton = hasChildren && (tag || isGroupNode);
    const tagColor = tag ? tag.color : '#9aa0a6';
    const tagCount = tag ? tag.count : 0;
    const occurrenceCount = tag ? (tagCount || getBookmarkCount(fullPath)) : 0;
    const showOccurrences = occurrenceCount > 1 && expandedOccurrences[fullPath];
    const hasMultipleOccurrences = occurrenceCount > 1;
    const visualDepth = Math.min(depth, 4);
    const rowClickHandler = isGroupNode
      ? `toggleNestedTag('${fullPath}', event)`
      : `handleTagClick('${fullPath}', event, ${occurrenceCount})`;

    let html = `
      <div class="tag-item ${hasChildren ? 'parent-tag' : ''} ${isGroupNode ? 'tag-group-node' : ''}" data-depth="${depth}" style="--tag-depth:${visualDepth};" onclick="${rowClickHandler}">
        <div class="tag-main">
          ${shouldShowExpandButton ? `<span class="tag-expand-icon ${isExpanded ? 'expanded' : ''}" onclick="toggleNestedTag('${fullPath}', event)" title="Toggle children">▶</span>` : '<span style="width:20px;"></span>'}
          <div class="tag-dot" style="background-color:${tagColor}; flex-shrink: 0;"></div>
          <span class="tag-name" title="#${fullPath}">#${isLocalSearchActive_() ? fullPath : key}</span>
          ${tagCount > 0 ? `<span class="tag-count-badge">${tagCount}</span>` : ''}
          ${hasMultipleOccurrences && !isGroupNode ? `<span class="tag-occurrence-toggle ${showOccurrences ? 'expanded' : ''}" onclick="toggleTagOccurrences('${fullPath}', event, ${occurrenceCount})" title="Toggle occurrences">◎</span>` : ''}
        </div>
      </div>
    `;

    if (showOccurrences) {
      html += renderOccurrencesList(fullPath, occurrenceCount, tagColor);
    }
    
    // Render children if expanded
    if (isExpanded && hasChildren) {
      html += '<div class="nested-children">';
      Object.keys(node.children).sort().forEach(childKey => {
        html += renderTagNode(node.children[childKey], childKey, depth + 1, projectId);
      });
      html += '</div>';
    }
    
    return html;
  }

  function renderProjectTags(project) {
    if (!project.tags || project.tags.length === 0) {
      return '<div class="tags-list"><p style="padding:20px;color:#80868b;font-size:12px;">No tags yet</p></div>';
    }

    // Build tree structure from flat tag list
    const tagTree = buildTagTree(project.tags);
    
    let html = '<div class="tags-list">';
    
    // Render all root-level tags
    Object.keys(tagTree).forEach(key => {
      html += renderTagNode(tagTree[key], key, 0, project.id);
    });
    
    html += '</div>';
    return html;
  }
  
  function toggleNestedTag(parentName, event) {
    if (event) event.stopPropagation();
    if (!expandedTags) expandedTags = {};
    expandedTags[parentName] = !expandedTags[parentName];
    refreshCurrentView_();
  }

  function toggleProject(projectName) {
    const index = expandedProjects.indexOf(projectName);
    if (index > -1) {
      expandedProjects.splice(index, 1);
    } else {
      expandedProjects.push(projectName);
    }
    refreshCurrentView_();
  }

  function setFilter(filter) {
    currentFilter = filter;
    expandedProjects = []; // Reset expansion state when changing filters
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.classList.remove('active');
      if (tab.dataset.filter === filter) {
        tab.classList.add('active');
      }
    });
    if (filter === 'global') {
      globalSubmittedQuery = '';
      globalSearchTerm = '';
      globalSearchResults = null;
      ensureGlobalAutocompleteCatalog_();
    }
    if (allTags) renderTags(allTags);
  }

  function showError(error) {
    console.error('Error:', error);
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="empty-title">Error Loading Tags</div>
        <p style="font-size:12px;color:#80868b;margin-top:8px;">${error.message || error}</p>
        <button onclick="loadTags()" style="margin-top:16px;padding:8px 16px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;">Try Again</button>
      </div>
    `;
  }

  function renderOccurrencesList(tagName, occurrenceCount, tagColor) {
    let html = '<div class="occurrences-list">';
    const details = occurrenceDetails[tagName];
    const isLoading = details && details.loading;
    const items = details && details.items ? details.items : null;

    if (items && items.length) {
      items.forEach(function(item, i) {
        let snippetText = item.snippet ? item.snippet : '...';
        if (snippetText.length > 30) {
          snippetText = snippetText.slice(0, 30).trimEnd() + '...';
        }
        html += `
          <div class="occurrence-item" onclick="jumpToTag('${tagName}', ${i}); event.stopPropagation();">
            <div class="tag-dot" style="background-color:${tagColor}; flex-shrink: 0;"></div>
            <div class="tag-name">${snippetText}</div>
          </div>
        `;
      });
    } else if (isLoading) {
      html += `
        <div class="occurrence-item">
          <div class="tag-dot" style="background-color:${tagColor}; flex-shrink: 0;"></div>
          <span class="tag-name">Loading occurrences...</span>
        </div>
      `;
    } else {
      for (let i = 0; i < occurrenceCount; i++) {
        const label = 'Occurrence ' + (i + 1);
        html += `
          <div class="occurrence-item" onclick="jumpToTag('${tagName}', ${i}); event.stopPropagation();">
            <div class="tag-dot" style="background-color:${tagColor}; flex-shrink: 0;"></div>
            <span class="tag-name">${label}</span>
          </div>
        `;
      }
    }
    html += '</div>';
    return html;
  }

  function refreshExpandedOccurrences() {
    const expandedTags = Object.keys(expandedOccurrences || {});
    expandedTags.forEach(function(tagName) {
      if (expandedOccurrences[tagName]) {
        fetchOccurrenceDetails(tagName);
      }
    });
  }

  function getBookmarkCount(tagName) {
    if (!allTags || !allTags.bookmarkCounts) return 0;
    return allTags.bookmarkCounts[tagName] || 0;
  }

  function handleTagClick(tagName, event, occurrenceCount) {
    if (event) event.stopPropagation();
    jumpToTag(tagName, 0);
  }

  function toggleTagOccurrences(tagName, event, occurrenceCount) {
    if (event) event.stopPropagation();
    const count = typeof occurrenceCount === 'number' ? occurrenceCount : getBookmarkCount(tagName);
    if (count <= 1) {
      jumpToTag(tagName, 0);
      return;
    }

    expandedOccurrences[tagName] = !expandedOccurrences[tagName];
    if (expandedOccurrences[tagName]) {
      fetchOccurrenceDetails(tagName);
    }
    refreshCurrentView_();
  }

  function fetchOccurrenceDetails(tagName) {
    if (occurrenceDetails[tagName] && occurrenceDetails[tagName].loading) {
      return;
    }
    const existingItems = occurrenceDetails[tagName] && occurrenceDetails[tagName].items ? occurrenceDetails[tagName].items : null;
    occurrenceDetails[tagName] = { loading: true, items: existingItems };
    google.script.run
      .withSuccessHandler(function(result) {
        const occurrences = result && result.occurrences ? result.occurrences : [];
        occurrenceDetails[tagName] = { loading: false, items: occurrences };
        refreshCurrentView_();
      })
      .withFailureHandler(function(error) {
        console.error('Error loading occurrences:', error);
        occurrenceDetails[tagName] = { loading: false, items: [] };
        refreshCurrentView_();
      })
      .getTagOccurrences(tagName, 80);
  }

  function jumpToTag(tagName, occurrenceIndex) {
    google.script.run
      .withSuccessHandler(function() {
        console.log('Navigated to tag:', tagName);
      })
      .withFailureHandler(function(error) {
        console.error('Error navigating to tag:', error);
      })
      .jumpToTagBookmark(tagName, occurrenceIndex || 0);
  }

</script>
